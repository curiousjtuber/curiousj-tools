# The operations and the PATH additions curiousj-tools ships: read ahead of
# the lists files, so `pssh -o NAME` has them with no file defining them,
# and an operation or [path] key of the same name in a lists file takes
# one's place. They select on the attributes of the lists' logins and
# paths: tag a checkout 'git' for git-pull, a login 'mise' for mise-update
# and the mise shims, and so on. `pssh -L` lists the operations.
#
# pssh runs them through a non-interactive ssh shell, which reads no rc file:
# [path] puts ahead of PATH what a login shell would have found there.

[operations.git-pull]                   # every git checkout, cloned where missing
command = "git pull --rebase --autostash"
paths = "git"
clone = true

[operations.uv-tool-update]             # each python checkout installed as an editable uv tool,
command = "uv tool install --force --reinstall --editable ."
paths = "py-project"                    # so a host runs its checkout as git-pull leaves it;
                                        # rerun for new commands or dependencies; uv is found
                                        # in ~/.local/bin, or the mise shims on a 'mise' login

[operations.mise-update]
command = "mise self-update -y && mise upgrade"
logins = "mise"

[operations.cachy-update]               # asks questions, so one login at a time
command = "cachy-update"
logins = "cachyos"
serial = true

[operations.brew-upgrade]               # a cask upgrade may ask for sudo: one login at a time
command = "brew update && brew upgrade"
logins = { any = ["mac", "brew"] }
serial = true

[operations.apt-upgrade]                # sudo and apt ask, so one login at a time too
command = "sudo apt update && sudo apt upgrade"
logins = { any = ["ubuntu", "debian"] }
serial = true

[operations.pacman-upgrade]             # plain Arch; a CachyOS login is tagged cachyos instead
command = "sudo pacman -Syu"
logins = "arch"
serial = true

[operations.dnf-upgrade]
command = "sudo dnf upgrade"
logins = "fedora"
serial = true

[operations.distrobox-upgrade]          # every container of the host, each through its own
command = "distrobox upgrade --all"     # package manager; sudo may ask, so one login at a time
logins = "distrobox"
serial = true

[operations.system-update]              # each login runs the member that applies to it
operations = ["cachy-update", "brew-upgrade", "apt-upgrade", "pacman-upgrade", "dnf-upgrade"]

[operations.update-all]
operations = ["git-pull", "uv-tool-update", "mise-update", "system-update", "distrobox-upgrade"]

[path]                                  # ahead of PATH on every login, and on those tagged
default = ["$HOME/.local/bin"]
mise = ["$HOME/.local/share/mise/shims"]
linuxbrew = ["/home/linuxbrew/.linuxbrew/bin", "/home/linuxbrew/.linuxbrew/sbin"]
mac = ["/opt/homebrew/bin", "/opt/homebrew/sbin"]
