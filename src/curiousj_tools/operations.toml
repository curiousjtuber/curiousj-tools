# The operations curiousj-tools ships: read ahead of the lists files, so
# `pssh -o NAME` has them with no file defining them, and an operation of
# the same name in a lists file takes one's place. They select on the
# attributes of the lists' logins and paths: tag a checkout 'git' for
# git-pull, a login 'mise' for mise-update, and so on. `pssh -L` lists them.
#
# pssh runs them through a non-interactive ssh shell, which reads no rc file:
# the PATH additions reach what a login shell would have found there.

[operations.git-pull]                   # every git checkout, cloned where missing
command = "git pull --rebase --autostash"
paths = "git"
clone = true

[operations.uv-tool-update]             # each python checkout installed as an editable uv tool,
command = "PATH=$HOME/.local/share/mise/shims:$PATH uv tool install --force --reinstall --editable ."
paths = "py-project"                    # so a host runs its checkout as git-pull leaves it;
                                        # rerun for new commands or dependencies

[operations.mise-update]
command = "export PATH=$HOME/.local/bin:$PATH; mise self-update -y && mise upgrade"
logins = "mise"

[operations.cachy-update]               # asks questions, so one login at a time
command = "cachy-update"
logins = "cachyos"
serial = true

[operations.brew-upgrade]
command = "export PATH=/opt/homebrew/bin:$PATH; brew update && brew upgrade"
logins = { any = ["mac", "brew"] }

[operations.apt-upgrade]                # sudo and apt ask, so one login at a time too
command = "sudo apt update && sudo apt upgrade"
logins = { any = ["ubuntu", "debian"] }
serial = true

[operations.distrobox-upgrade]          # every container of the host, each through its own
command = "distrobox upgrade --all"     # package manager; sudo may ask, so one login at a time
logins = "distrobox"
serial = true

[operations.system-update]              # each login runs the member that applies to it
operations = ["cachy-update", "brew-upgrade", "apt-upgrade"]

[operations.update-all]
operations = ["git-pull", "uv-tool-update", "mise-update", "system-update", "distrobox-upgrade"]
