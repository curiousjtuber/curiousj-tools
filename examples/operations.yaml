# Operations in a file of their own, read alongside ssh-lists.yaml: every
# .toml, .yaml, .yml or .json file in ~/.config/ssh-lists/, or in a directory
# on $SSH_LISTS_PATH, is, by name, as one list. So routines are added without
# touching the logins, or kept in a file one host alone has. An operation
# both files define keeps the first one's, with a warning.
operations:
  git-status:                            # per path: `pssh -o git-status`, in the git checkouts
    command: git status --short --branch
    paths: git
  git-fetch:
    command: git fetch --prune
    paths: git
  disk:                                  # per login, every one: no condition
    command: df -h ~
  updates-pending:
    command: checkupdates | wc -l
    logins: cachyos
  morning:                               # a group; a member may live in the other file
    operations: [git-fetch, git-status, disk, mise-update]
