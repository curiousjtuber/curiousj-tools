# The logins xssh, pssh and ssh-logins reach, and the paths `pssh -P` works in.
# Lives at ~/.config/ssh-lists.toml, or on $SSH_LISTS_PATH (see README);
# the same file can be YAML (ssh-lists.yaml) or JSON (ssh-lists.json).

logins = [
    "alice@devbox",                      # [user@]host, as ssh takes it
    "build.example.com",
    # a table where a login needs more: commands run after login in the pane
    # xssh opens; end in something interactive, or the pane ends
    { login = "my-mac.local", commands = ["cd src", "exec zsh"] },
    # the same login twice: one pane on the host, one inside its container;
    # via is how pssh runs its command in there (handed `sh -c '...'`), so
    # `pssh -P -c` keeps a container's separate home current too
    { login = "alice@devbox", commands = ["distrobox enter dev -nw"], via = "distrobox enter dev -nw --" },
]

[[paths]]
path = "dotfiles"                        # relative to ~ unless absolute
git_url = "git@github.com:me/dotfiles.git"   # optional: `pssh -c` clones it when missing

[[paths]]
path = "src/webapp"
git_url = "git@github.com:me/webapp.git"
git_branch = "main"                      # optional: -b for the clone

[[paths]]
path = "/opt/tools/mytool"               # no git_url: never cloned, skipped where absent
