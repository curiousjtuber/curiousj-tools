# The logins xssh, pssh and ssh-logins reach, the paths `pssh -P` works in,
# and the operations `pssh -o` and `xssh -o` run. Lives in
# ~/.config/ssh-lists/, or in a directory on $SSH_LISTS_PATH (see README);
# the same file can be YAML (ssh-lists.yaml) or JSON (ssh-lists.json), and
# every such file side by side makes one list.

logins = [
    "build.example.com",                 # [user@]host, as ssh takes it
    # a table where a login needs more: attributes are what operations and
    # '-a' select on, flags or key=value
    { login = "alice@devbox", attributes = ["cachyos", "mise", "dev"] },
    # commands run after login in the pane xssh opens; end in something
    # interactive, or the pane ends. operations: this login's own command for
    # an operation, run whatever the operation's condition says
    { login = "my-mac.local", commands = ["cd src", "exec zsh"], attributes = ["mac", "brew", "mise"], operations = { brew-upgrade = "brew update && brew upgrade --greedy" } },
    # the same login twice: one pane on the host, one inside its container;
    # via is how pssh runs its command in there (handed `sh -c `...'`), so
    # `pssh -o git-pull` keeps a container's separate home current too; one
    # sharing the host's home (distrobox's default) takes attributes =
    # ["shared-home"], and then no per-path work, which the host does
    { login = "alice@devbox", commands = ["distrobox enter dev -nw"], via = "distrobox enter dev -nw --" },
]

[[paths]]
path = "dotfiles"                        # relative to ~ unless absolute
git_url = "git@github.com:me/dotfiles.git"   # optional: `pssh -c` clones it when missing
attributes = ["git"]

[[paths]]
path = "src/webapp"
git_url = "git@github.com:me/webapp.git"
git_branch = "main"                      # optional: -b for the clone
attributes = ["git", "py-project"]
logins = "dev"                           # optional: cloned only on the logins matching;
                                         # pulled elsewhere too, where already there

[[paths]]
path = "/opt/tools/mytool"               # no git_url: never cloned, skipped where absent
operations = { git-pull = "git pull --ff-only" }   # this path's own way of being pulled

# Operations: `pssh -o NAME` runs one on every login it applies to, `xssh -o
# NAME` opens a synchronized pane per such login instead. git-pull,
# uv-tool-update, mise-update, cachy-update, brew-upgrade, apt-upgrade,
# system-update and update-all come built in (`pssh -L` lists them); these add to them. A
# condition is a term ('mise', 'arch=x86_64', '!mise', 'arch!=x86_64'), a
# list of terms that all hold, or a table with all, any, none.

[operations.brew-upgrade]                # the built-in's name: this takes its place
command = "export PATH=/opt/homebrew/bin:$PATH; brew update && brew upgrade"
logins = { any = ["mac", "brew"], none = "headless" }

[operations.test]                        # per path: 'paths' says which (true: all of them)
command = "uv run pytest -q"
paths = "py-project"

[operations.nightly]                     # a group: each login runs the members that apply to it
operations = ["update-all", "test"]
