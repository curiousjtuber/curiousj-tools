[project]
name = "curiousj-tools"
version = "0.1.0"
description = "Small ssh/tmux/Emacs command-line tools: sshtsf, xssh, pssh, ssh-hosts, emacsclient-auto"
readme = "README.md"
license = "MIT"
authors = [{ name = "CuriousJ", email = "curious.j.tuber@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/curiousjtuber/curiousj-tools"

[project.scripts]
sshtsf = "curiousj_tools.sshtsf:main"
xssh = "curiousj_tools.xssh:main"
pssh = "curiousj_tools.pssh:main"
ssh-hosts = "curiousj_tools.hosts:main"
pick-lines = "curiousj_tools.pick:main"
emacsclient-auto = "curiousj_tools.emacsclient_auto:main"
ec-browse = "curiousj_tools.ec_browse:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curiousj_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
